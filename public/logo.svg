<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e112a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Outer border glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Play button glow -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Pulse lightning bolt gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container App Icon Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.65"/>

  <!-- Audio Pulse / Analytics Wave Bars Behind Triangle -->
  <g opacity="0.25">
    <rect x="76" y="220" width="16" height="72" rx="8" fill="#f43f5e"/>
    <rect x="108" y="180" width="16" height="152" rx="8" fill="#8b5cf6"/>
    <rect x="388" y="190" width="16" height="132" rx="8" fill="#8b5cf6"/>
    <rect x="420" y="225" width="16" height="62" rx="8" fill="#06b6d4"/>
  </g>

  <!-- YouTube Play Triangle Base with Rounded Corners -->
  <path d="M 172 138 C 158 130 140 140 140 156 L 140 356 C 140 372 158 382 172 374 L 348 274 C 362 266 362 246 348 238 Z"
        fill="url(#playGrad)"
        filter="url(#glow)"/>

  <!-- Energy Cut & Neon Lightning Pulse -->
  <path d="M 284 132 L 206 256 L 268 256 L 228 376 L 332 236 L 272 236 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)"/>

  <!-- Core White Highlight Spark -->
  <circle cx="270" cy="246" r="6" fill="#ffffff" opacity="0.9"/>
</svg>
